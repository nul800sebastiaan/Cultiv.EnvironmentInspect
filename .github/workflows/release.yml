name: Build and Package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_EXTENSION: "Cultiv.EnvironmentInspect"
  PATH_TO_TESTSITE: "Cultiv.EnvironmentInspect.DemoSite"
  DOTNET_VERSION: '10'

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      
      - name: Fetch all tags
        run: git fetch --force --tags
        
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: false
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Check Release
        run: |
          if [ -z "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "::error::No release version generated. Ensure there are conventional commits since the last release."
            exit 1
          fi
          echo "Release version: ${{ steps.semantic.outputs.new_release_version }}"

      - name: Echo the version
        run: |
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '${{env.PATH_TO_EXTENSION}}/Client/package-lock.json'

    - name: Install dependencies
      working-directory: ./${{env.PATH_TO_EXTENSION}}/Client
      run: npm ci

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: ${{ env.PATH_TO_EXTENSION }}

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release   

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $MyProcess = Start-Process -FilePath 'dotnet' -WorkingDirectory . -ArgumentList 'run --no-build --no-restore -c Release' -PassThru
        echo "DOTNET_PID=$($MyProcess.Id)" >> $env:GITHUB_ENV
        Start-Sleep -Seconds 10

    - name: CodeGen
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        sleep 10s
        npm run generate-client

    - name: Stop Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
         Stop-Process -Id $env:DOTNET_PID
         
    - name: Build Client
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm run build

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
    
    - name: Install Package Validation Tool
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet tool install -g dotnet-validate --prerelease
    
    - name: Validate NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet validate package local ${{ env.PATH_TO_EXTENSION }}/bin/Release/Cultiv.EnvironmentInspect.*.nupkg
    
    - name: Create GitHub Release
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.setup.outputs.semver }}
        name: v${{ needs.setup.outputs.semver }}
        generate_release_notes: true
        prerelease: ${{ contains(needs.setup.outputs.semver, '-') }}
        body: |
          ## Installation
          
          ```bash
          ${{ contains(needs.setup.outputs.semver, '-') && format('dotnet add package Cultiv.EnvironmentInspect --version {0} --source https://nuget.pkg.github.com/nul800sebastiaan/index.json', needs.setup.outputs.semver) || format('dotnet add package Cultiv.EnvironmentInspect --version {0}', needs.setup.outputs.semver) }}
          ```
    
    - name: Add GitHub Packages Source
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/nul800sebastiaan/index.json"

    - name: Push NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Cultiv.EnvironmentInspect.*.nupkg"  --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
    
    - name: Push MyGet Package
      if: needs.setup.outputs.new_release_published == 'true' && env.MYGET_API_KEY != ''
      run: dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Cultiv.EnvironmentInspect.*.nupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
      
    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && startsWith(github.ref, 'refs/heads/release/') && !contains(needs.setup.outputs.semver, '-') }}
      run: |
        dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Cultiv.EnvironmentInspect.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Merge release branch to develop
      if: ${{ needs.setup.outputs.new_release_published == 'true' && startsWith(github.ref, 'refs/heads/release/') }}
      run: .github/scripts/merge-to-develop.sh "${{ needs.setup.outputs.semver }}"