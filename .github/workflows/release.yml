name: Build and Package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_EXTENSION: "Cultiv.EnvironmentInspect"
  PATH_TO_TESTSITE: "Cultiv.EnvironmentInspect.DemoSite"
  DOTNET_VERSION: '10'

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      
      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Update .releaserc for current branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Current branch: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
            # Convert branch name to valid semver prerelease identifier
            # Prefix with "00-" to ensure these versions sort before alpha/beta/rc
            # Truncate to max 15 chars total to keep NuGet paths short
            # Replace feature->ft and hotfix->hf to save more space
            BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/feature\//ft-/g; s/hotfix\//hf-/g; s/\//-/g' | cut -c 1-12)
            PRERELEASE_ID="00-${BRANCH_SLUG}"
            echo "Adding branch config: $BRANCH_NAME with prerelease: $PRERELEASE_ID"
            
            # Read current .releaserc, add the branch entry, and save
            jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
              '.branches += [{"name": $name, "prerelease": $prerelease}]' \
              .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc
            
            echo "Updated .releaserc:"
            cat .releaserc
          else
            echo "Branch does not match hotfix/* or feature/*, no update needed"
          fi
        
      - name: Semantic Release (Dry Run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Check Release
        run: |
          if [ -z "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "::error::No release version generated. Ensure there are conventional commits since the last release."
            exit 1
          fi
          echo "Release version: ${{ steps.semantic.outputs.new_release_version }}"

      - name: Echo the version
        run: |
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '${{env.PATH_TO_EXTENSION}}/Client/package-lock.json'

    - name: Install dependencies
      working-directory: ./${{env.PATH_TO_EXTENSION}}/Client
      run: npm ci

    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: ${{ env.PATH_TO_EXTENSION }}

    - name: Lint Client code
      working-directory: ./${{env.PATH_TO_EXTENSION}}/Client
      run: npm run lint

    - name: Dotnet Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release   

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup dotnet run --no-build --no-restore -c Release > ../app.log 2> ../app-errors.log &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        echo "Started Umbraco with PID: $!"
        echo "Waiting 5 seconds for initial startup..."
        sleep 5
    
    - name: Health Check
      shell: bash
      run: |
        echo "Checking if Umbraco is responding..."
        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44310 | grep -q "200\|302"; then
            echo "Umbraco is responding!"
            exit 0
          fi
          echo "Attempt $i: Not ready yet, waiting 2 seconds..."
          sleep 2
        done
        echo "Umbraco failed to respond after 30 attempts"
        exit 1

    - name: CodeGen
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm run generate-client

    - name: Stop Project
      if: always()
      shell: bash
      run: |
        if [ -n "$DOTNET_PID" ]; then
          if ps -p $DOTNET_PID > /dev/null 2>&1; then
            echo "Umbraco process $DOTNET_PID is still running, stopping it..."
            kill $DOTNET_PID 2>/dev/null || true
            sleep 2
          else
            echo "Umbraco process $DOTNET_PID had already stopped"
          fi
        else
          echo "No DOTNET_PID set"
        fi
         
    - name: Check for Migration Errors
      shell: pwsh
      run: |
        pwsh .github/scripts/Check-MigrationErrors.ps1 -LogPath "app.log"
         
    - name: Build Client
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm run build

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
    
    - name: Upload NuGet Package for Testing
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: |
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.nupkg
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.snupkg
        retention-days: 1
    
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sqlite-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3
  
  test-sqlserver:
    name: Test with SQL Server LocalDB
    runs-on: windows-latest
    if: ${{ github.actor != 'nektos/act' }}
    needs: [setup, build]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-
    
    - name: Download NuGet Package
      uses: actions/download-artifact@v8
      with:
        name: nuget-package
        path: ./nuget-packages
    
    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Cultiv.EnvironmentInspect" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        "@ | Set-Content nuget.config
    
    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: |
        dotnet remove reference ../Cultiv.EnvironmentInspect/Cultiv.EnvironmentInspect.csproj
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }}
    
    - name: Update Connection String to LocalDB
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $appsettings = Get-Content "appsettings.json" -Raw | ConvertFrom-Json
        $appsettings.ConnectionStrings.umbracoDbDSN = "Server=(localdb)\MSSQLLocalDB;Database=UmbracoTest;Integrated Security=True;TrustServerCertificate=True"
        $appsettings.ConnectionStrings.umbracoDbDSN_ProviderName = "Microsoft.Data.SqlClient"
        # Reduce database connection retry attempts from 5 to 2
        if (-not $appsettings.Umbraco.CMS.Global.PSObject.Properties.Name -contains 'InstallMissingDatabase') {
          $appsettings.Umbraco.CMS.Global | Add-Member -NotePropertyName InstallMissingDatabase -NotePropertyValue $true -Force
        } else {
          $appsettings.Umbraco.CMS.Global.InstallMissingDatabase = $true
        }
        $appsettings | ConvertTo-Json -Depth 10 | Set-Content "appsettings.json"
    
    - name: Restore and Build with NuGet Package
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release
    
    - name: Start Application with LocalDB
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $MyProcess = Start-Process -FilePath 'dotnet' -WorkingDirectory . -ArgumentList 'run --no-build -c Release' -PassThru -RedirectStandardOutput "../app.log" -RedirectStandardError "../app-errors.log"
        echo "DOTNET_PID=$($MyProcess.Id)" >> $env:GITHUB_ENV
        Write-Host "Started Umbraco with PID: $($MyProcess.Id)"
        Write-Host "Waiting 10 seconds for initial startup..."
        Start-Sleep -Seconds 10
        
        Write-Host "Checking if Umbraco is responding..."
        for ($i = 1; $i -le 30; $i++) {
          try {
            $response = Invoke-WebRequest -Uri "https://localhost:44310" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 2
            if ($response.StatusCode -eq 200 -or $response.StatusCode -eq 302) {
              Write-Host "Umbraco is responding!"
              break
            }
          } catch {
            Write-Host "Attempt ${i}: Not ready yet, waiting 2 seconds..."
            Start-Sleep -Seconds 2
          }
        }
        
        # Final check
        try {
          $response = Invoke-WebRequest -Uri "https://localhost:44310" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 2
          if ($response.StatusCode -eq 200 -or $response.StatusCode -eq 302) {
            Write-Host "✓ Umbraco is responding successfully!"
          } else {
            Write-Host "ERROR: Umbraco failed to respond after 30 attempts"
            exit 1
          }
        } catch {
          Write-Host "ERROR: Umbraco failed to respond after 30 attempts"
          exit 1
        }
    
    - name: Check for Migration Errors
      shell: pwsh
      run: |
        pwsh .github/scripts/Check-MigrationErrors.ps1 -LogPath "app.log"
    
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sqlserver-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3
    
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [setup, build, test-sqlserver]
    timeout-minutes: 5
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Download NuGet Package
      uses: actions/download-artifact@v8
      with:
        name: nuget-package
        path: ./nuget-packages
    
    - name: Install Package Validation Tool
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        dotnet tool install -g dotnet-validate --prerelease
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
    
    - name: Validate NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        export PATH="$HOME/.dotnet/tools:$PATH"
        dotnet validate package local nuget-packages/Cultiv.EnvironmentInspect.*.nupkg
    
    - name: Add GitHub Packages Source
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/nul800sebastiaan/index.json"

    - name: Push GitHub Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "nuget-packages/Cultiv.EnvironmentInspect.*.nupkg"  --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
    
    - name: Push MyGet Package
      if: needs.setup.outputs.new_release_published == 'true' && env.MYGET_API_KEY != ''
      run: |
        dotnet nuget push "nuget-packages/Cultiv.EnvironmentInspect.*.nupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
        dotnet nuget push "nuget-packages/Cultiv.EnvironmentInspect.*.snupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/symbols/api/v2/package --skip-duplicate
      
    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/')) && (!contains(needs.setup.outputs.semver, '-') || contains(needs.setup.outputs.semver, '-beta.')) }}
      run: |
        dotnet nuget push "nuget-packages/Cultiv.EnvironmentInspect.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Write Summary
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        echo "## 📦 Package Built: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Ready for release" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.create_github_release != 'false' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: tree:0
    
    - name: Fetch all tags
      run: git fetch --force --tags

    - name: Update .releaserc for current branch
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        echo "Current branch: $BRANCH_NAME"
        
        if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
          # Convert branch name to valid semver prerelease identifier
          # Prefix with "00-" to ensure these versions sort before alpha/beta/rc
          # Truncate to max 15 chars total to keep NuGet paths short
          # Replace feature->ft and hotfix->hf to save more space
          BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/feature\//ft-/g; s/hotfix\//hf-/g; s/\//-/g' | cut -c 1-12)
          PRERELEASE_ID="00-${BRANCH_SLUG}"
          echo "Adding branch config: $BRANCH_NAME with prerelease: $PRERELEASE_ID"
          
          # Read current .releaserc, add the branch entry, and save
          jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
            '.branches += [{"name": $name, "prerelease": $prerelease}]' \
            .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc
          
          echo "Updated .releaserc:"
          cat .releaserc
        else
          echo "Branch does not match hotfix/* or feature/*, no update needed"
        fi

    - name: Generate Release Notes Body
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        
        # Check if this is a feature or hotfix branch test release
        if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
          echo "## ⚠️ Test Release from \`$BRANCH_NAME\`" > release_body.md
          echo "" >> release_body.md
          echo "This is a test release for development and testing purposes only." >> release_body.md
          echo "" >> release_body.md
          echo "### Installation" >> release_body.md
          echo "" >> release_body.md
          cat << 'EOF' >> release_body.md
        ```bash
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }} --source https://nuget.pkg.github.com/nul800sebastiaan/index.json
        ```
        EOF
        # Check if publishing to nuget.org (for stable or beta releases)
        elif [[ "${{ github.event.inputs.publish_to_nuget }}" == "true" && ("${{ needs.setup.outputs.semver }}" != *"-"* || "${{ needs.setup.outputs.semver }}" == *"-beta."*) ]]; then
          cat << 'EOF' > release_body.md
        ## Installation
        
        ```bash
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }}
        ```
        EOF
          
          # Find the previous nuget.org release tag using git tags directly
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          
          # Get the previous stable or beta tag (these are the ones published to nuget.org)
          CURRENT_TAG="v${{ needs.setup.outputs.semver }}"
          if [[ "${{ needs.setup.outputs.semver }}" == *"-beta."* ]]; then
            # Beta release: compare against previous stable or beta tag
            LAST_NUGET_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | grep -v "^${CURRENT_TAG}$" | head -n1)
          else
            # Stable release: compare against previous stable tag
            LAST_NUGET_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CURRENT_TAG}$" | head -n1)
          fi
          
          if [[ -n "$LAST_NUGET_TAG" ]]; then
            echo "## What's Changed (since $LAST_NUGET_TAG)" >> release_body.md
            echo "" >> release_body.md
            gh api repos/${{ github.repository }}/releases/generate-notes -F tag_name="v${{ needs.setup.outputs.semver }}" -F previous_tag_name="$LAST_NUGET_TAG" --jq .body >> release_body.md
          else
            echo "## What's Changed" >> release_body.md
            echo "" >> release_body.md
            gh api repos/${{ github.repository }}/releases/generate-notes -F tag_name="v${{ needs.setup.outputs.semver }}" --jq .body >> release_body.md
          fi
        else
          # Not publishing to nuget.org - show alternative sources
          echo "## Installation" > release_body.md
          echo "" >> release_body.md
          
          cat << 'EOF' >> release_body.md
        ### From GitHub Packages (pre-release)
        
        ```bash
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }} --source https://nuget.pkg.github.com/nul800sebastiaan/index.json
        ```
        EOF
          
          # Add MyGet section if API key is available (check via GitHub context)
          if [[ -n "${{ secrets.MYGET_API_KEY }}" ]]; then
            cat << 'EOF' >> release_body.md
        
        ### From MyGet (pre-release)
        
        ```bash
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }} --source https://www.myget.org/F/umbraco-packages/api/v3/index.json
        ```
        EOF
          fi
        fi

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        dry_run: false
        extra_plugins: |
          @semantic-release/exec
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/github
          conventional-changelog-conventionalcommits

    - name: Update GitHub Release with Custom Notes
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.setup.outputs.semver }}
        name: v${{ needs.setup.outputs.semver }}
        body_path: release_body.md
        prerelease: ${{ contains(needs.setup.outputs.semver, '-') }}

    - name: Merge release branch to develop
      if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/') }}
      run: |
        # Extract version from release branch (e.g., release/v2 -> v2)
        VERSION_SUFFIX=$(echo ${GITHUB_REF#refs/heads/release/})
        if [[ "$VERSION_SUFFIX" == "$GITHUB_REF" ]]; then
          # For beta branches (e.g., beta/v2 -> v2)
          VERSION_SUFFIX=$(echo ${GITHUB_REF#refs/heads/beta/})
        fi
        DEVELOP_BRANCH="develop/$VERSION_SUFFIX"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Fetch the develop branch
        git fetch origin $DEVELOP_BRANCH
        
        # Checkout develop branch
        git checkout $DEVELOP_BRANCH
        
        # Merge release branch into develop
        git merge --no-ff origin/${GITHUB_REF#refs/heads/} -m "chore: merge ${GITHUB_REF#refs/heads/} into $DEVELOP_BRANCH after release ${{ needs.setup.outputs.semver }}"
        
        # Push changes
        git push origin $DEVELOP_BRANCH

    - name: Write Summary
      run: |
        echo "## 🚀 Release Published: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** \`v${{ needs.setup.outputs.semver }}\`" >> $GITHUB_STEP_SUMMARY

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'nektos/act' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'