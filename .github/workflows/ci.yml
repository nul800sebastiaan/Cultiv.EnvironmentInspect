name: Verify Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_EXTENSION: "Cultiv.EnvironmentInspect"
  PATH_TO_TESTSITE: "Cultiv.EnvironmentInspect.DemoSite"
  DOTNET_VERSION: '10'

on:
  push:
    branches: 
      - "develop/v2"
      - "release/v2"
      - "feature/v2/**"
  pull_request:
    branches:
      - develop/v2
      - release/v2
      - feature/v2/**
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      semver: ${{ steps.set-version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags
          
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Set Version
        id: set-version
        run: |
          if [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            # Get the latest tag from git
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              # Remove 'v' prefix if present
              LATEST_VERSION=${LATEST_TAG#v}
              echo "version=${LATEST_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            else
              echo "version=0.1.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Echo the version
        run: |
          echo "Version to use: '${{ steps.set-version.outputs.version }}'"
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '${{env.PATH_TO_EXTENSION}}/Client/package-lock.json'

    - name: Install dependencies
      working-directory: ./${{env.PATH_TO_EXTENSION}}/Client
      run: npm ci

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: ${{ env.PATH_TO_EXTENSION }}

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release   

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $MyProcess = Start-Process -FilePath 'dotnet' -WorkingDirectory . -ArgumentList 'run --no-build --no-restore -c Release' -PassThru
        echo "DOTNET_PID=$($MyProcess.Id)" >> $env:GITHUB_ENV
        Start-Sleep -Seconds 10

    - name: CodeGen
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        sleep 10s
        npm run generate-client

    - name: Stop Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
         Stop-Process -Id $env:DOTNET_PID
         
    - name: Build Client
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm run build

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
    
    - name: Upload NuGet Package for Testing
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: |
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.nupkg
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.snupkg
        retention-days: 1
    
    - name: Install Package Validation Tool
      run: dotnet tool install -g dotnet-validate --prerelease
    
    - name: Validate NuGet Package
      run: dotnet validate package local ${{ env.PATH_TO_EXTENSION }}/bin/Release/Cultiv.EnvironmentInspect.*.nupkg
  
  test-sqlserver:
    name: Test with SQL Server LocalDB
    runs-on: windows-latest
    needs: [setup, build]
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Download NuGet Package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./nuget-packages
    
    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Cultiv.EnvironmentInspect" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        "@ | Set-Content nuget.config
    
    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: |
        dotnet remove reference ../Cultiv.EnvironmentInspect/Cultiv.EnvironmentInspect.csproj
        dotnet add package Cultiv.EnvironmentInspect --version ${{ needs.setup.outputs.semver }}
    
    - name: Update Connection String to LocalDB
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $appsettings = Get-Content "appsettings.json" -Raw | ConvertFrom-Json
        $appsettings.ConnectionStrings.umbracoDbDSN = "Data Source=(localdb)\MSSQLLocalDB;AttachDbFilename=|DataDirectory|\Umbraco.mdf;Integrated Security=True"
        $appsettings.ConnectionStrings.umbracoDbDSN_ProviderName = "Microsoft.Data.SqlClient"
        $appsettings | ConvertTo-Json -Depth 10 | Set-Content "appsettings.json"
    
    - name: Restore and Build with NuGet Package
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release
    
    - name: Start Application with LocalDB
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $MyProcess = Start-Process -FilePath 'dotnet' -WorkingDirectory . -ArgumentList 'run --no-build -c Release' -PassThru -RedirectStandardOutput "../app.log" -RedirectStandardError "../app-errors.log"
        echo "DOTNET_PID=$($MyProcess.Id)" >> $env:GITHUB_ENV
        Start-Sleep -Seconds 15
    
    - name: Check for Migration Errors
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $logs = Get-Content "../app.log", "../app-errors.log" -ErrorAction SilentlyContinue
        $errors = $logs | Select-String -Pattern "ERR|FTL|migration.*fail|PendingModelChanges" -CaseSensitive:$false
        if ($errors) {
          Write-Host "::error::Migration errors detected:"
          $errors | ForEach-Object { Write-Host $_ }
          exit 1
        }
        $success = $logs | Select-String -Pattern "migrations completed|No pending migrations" -CaseSensitive:$false
        if ($success) {
          Write-Host "✓ SQL Server migrations successful"
        } else {
          Write-Host "::warning::Could not verify migration success"
        }
    
    - name: Stop Application
      if: always()
      shell: pwsh
      run: |
        if ($env:DOTNET_PID) {
          Stop-Process -Id $env:DOTNET_PID -Force -ErrorAction SilentlyContinue
        }
    
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sqlserver-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3