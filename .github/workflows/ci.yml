name: Verify Build

env:
  PATH_TO_EXTENSION: "Cultiv.EnvironmentInspect"
  PATH_TO_TESTSITE: "Cultiv.EnvironmentInspect.DemoSite"
  DOTNET_VERSION: '10'

on:
  pull_request:
    branches:
    - develop/v2
    - main/v2
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/github

      - name: Echo the version
        run: |
          echo ${{ steps.semantic.outputs.new_release_version }}
          echo ${{ steps.semantic.outputs.new_release_major_version }}
          echo ${{ steps.semantic.outputs.new_release_minor_version }}
          echo ${{ steps.semantic.outputs.new_release_patch_version }}
  
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Build Client
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm i

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release   

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
        $MyProcess = Start-Process -FilePath 'dotnet' -WorkingDirectory . -ArgumentList 'run --no-build --no-restore -c Release' -PassThru
        echo "DOTNET_PID=$($MyProcess.Id)" >> $env:GITHUB_ENV

    - name: CodeGen
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        sleep 10s
        npm run generate-client

    - name: Stop Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: pwsh
      run: |
         Stop-Process -Id $env:DOTNET_PID
         
    - name: Build Client
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        cd Client
        npm run build        

    - name: Build sln
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release        